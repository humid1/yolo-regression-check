[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-regression-check"
version = "0.2.0"
description = "Compare object detection predictions and diagnose regressions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["yolo_regression*"]
